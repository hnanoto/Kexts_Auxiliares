name: CI and Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Show xcodegen version
        run: xcodegen --version

      - name: Resolve release version
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            echo "KEXT_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "KEXT_VERSION=1.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
          echo "KEXT_BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build release kexts
        run: ./scripts/build_release_kexts.sh

      - name: Upload build debug logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-logs
          path: |
            /tmp/kexts_aux_generate.log
            /tmp/kexts_aux_build.log

      - name: Validate kexts
        run: ./scripts/validate_kexts.sh

      - name: Package release assets
        run: ./scripts/package_release_assets.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kexts-release-dist
          path: dist/release/*

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: kexts-release-dist
          path: dist/release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
