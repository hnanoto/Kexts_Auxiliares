name: Build Kexts

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build release kexts
        run: ./scripts/build_release_kexts.sh

      - name: Validate kexts
        run: ./scripts/validate_kexts.sh

      - name: Hash binaries
        run: ./scripts/hash_kexts.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kexts-release
          path: |
            kexts/AirPortUtility.kext
            kexts/BluetoothFileExchange.kext
